[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdoctor"
version = "0.2.1"
description = "A tiny static linter for LLM prompts: catch missing output formats, vague wording and conflicting constraints before you ship them."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mhn0328" }]
keywords = ["llm", "prompt-engineering", "linter", "ai", "cli", "openai", "prompt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

[project.scripts]
promptdoctor = "promptdoctor.cli:main"

[project.urls]
Homepage = "https://github.com/mhn0328/promptdoctor"
Issues = "https://github.com/mhn0328/promptdoctor/issues"

[tool.setuptools.packages.find]
where = ["src"]
